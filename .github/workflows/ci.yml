name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the tree. Declared explicitly so the job keeps a read-only GITHUB_TOKEN
# regardless of the repository's default-permissions setting.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DDB_ENDPOINT: http://localhost:8000
      # The two presign tests build a real boto3 S3 client. Presigning signs
      # locally and never calls AWS, so dummy values are enough — but absent
      # credentials raise NoCredentialsError and fail the suite.
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Start DynamoDB Local
        run: |
          docker run -d --rm -p 8000:8000 --name ddb-local amazon/dynamodb-local:latest
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not come up" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # matches terraform/lambda.tf

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cross-attribution boundary checks
        run: node scripts/check-crosstab.mjs

      - name: Credits page rendering checks
        run: node scripts/check-credits.mjs

      - name: HTML pattern attributes compile under the RegExp v flag
        run: node scripts/check-html-patterns.mjs

      - name: Admin items-list sort checks
        run: node scripts/check-item-sort.mjs

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Formatting
        run: terraform fmt -check -recursive

      # -backend=false skips the S3 state bucket, so no AWS credentials are needed.
      # Providers still install at the versions pinned in .terraform.lock.hcl.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
