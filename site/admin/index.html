<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בעיניי · ניהול</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="topbar">
    <span class="wordmark">בעיניי<span class="dot">.</span> <span class="brand">RealVote</span> · ניהול</span>
    <span id="mode-badge" class="badge"></span>
  </header>
  <div class="rule"></div>

  <section id="login" class="hidden">
    <h2>התחברות</h2>
    <form id="login-form">
      <input id="l-email" type="email" placeholder="דוא״ל" required autocomplete="username">
      <input id="l-pass" type="password" placeholder="סיסמה" required autocomplete="current-password">
      <button type="submit">כניסה</button>
    </form>
    <form id="newpass-form" class="hidden">
      <p class="muted">נדרשת סיסמה חדשה בכניסה הראשונה</p>
      <input id="l-newpass" type="password" placeholder="סיסמה חדשה" required autocomplete="new-password">
      <button type="submit">עדכון סיסמה</button>
    </form>
  </section>

  <main id="admin-main" class="hidden">
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="queue">הצעות <span class="tab-count" id="tab-count"></span></button>
      <button class="tab" data-tab="items">פריטים</button>
      <button class="tab" data-tab="votes">הצבעות</button>
    </nav>

    <section id="panel-queue" class="hidden">
      <h2>הצעות ממתינות</h2>
      <div id="queue"></div>
    </section>

    <section id="panel-items" class="hidden">
      <h2>פריט חדש</h2>
      <form id="create-form">
        <input id="c-id" placeholder="item-id (a-z, 0-9, -)" pattern="[a-z0-9-]{1,64}">
        <input id="c-name" placeholder="שם בעברית" required>
        <input id="c-emoji" placeholder="אימוג׳י" size="4">
        <select id="c-cat" required aria-label="קטגוריה"></select>
        <label><input type="checkbox" id="c-image"> עם תמונה</label>
        <input type="file" id="c-file" accept="image/*" class="hidden" aria-label="תמונה">
        <button type="submit">יצירה</button>
      </form>
      <label class="inline"><input type="checkbox" id="show-archived"> הצג בארכיון</label>
      <h2>פריטים</h2>
      <div id="items"></div>
    </section>

    <section id="panel-votes" class="hidden">
      <h2>הצבעות</h2>
      <div id="votes-body"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <!-- Vendored (no CDN): UMD bundle, so it's a classic script exposing window.AmazonCognitoIdentity,
       not an ES module — it must load and run before admin.js so the global is ready in time. -->
  <script src="/admin/vendor/amazon-cognito-identity.min.js"></script>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
